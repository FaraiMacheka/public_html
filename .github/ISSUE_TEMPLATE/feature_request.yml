name: Feature request
description: Suggest a new page, content update, or UX improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Why it matters
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: Affected site or folder
      placeholder: conference.hhi.org.za
  - type: textarea
    id: notes
    attributes:
      label: Extra context

